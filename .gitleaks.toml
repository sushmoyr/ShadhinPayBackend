# Gitleaks configuration for ConfluxPay.
#
# Extends gitleaks' default ruleset (kept up to date with the bundled binary).
# Allowlists below are reserved for verified-safe matches that the default
# `generic-api-key` heuristic flags incorrectly. Each entry MUST cite the
# exact fingerprint reported by `gitleaks detect` so unrelated occurrences
# of the same string are still caught.
#
# To add a new entry:
#   1. Run `gitleaks detect --source . -v` and copy the `Fingerprint:` field.
#   2. Add a new sub-table under `[[rules.allowlists]]` with that fingerprint
#      and a one-line comment explaining why the match is safe.
#   3. Re-run `gitleaks detect` and confirm zero findings.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = """
  Test fixture in conflux-adapters/.../VendorCredentialsTest.java that asserts
  VendorCredentials.toString() redacts every value. The literal token landed in
  the initial commit (3df40bb) before the redaction-fixture rewrite that replaced
  it with a low-entropy placeholder; this fingerprint allowlists only that exact
  historical occurrence so the file path is no longer scanned at line 17 of that
  commit. Any future high-entropy string in the same file will still be flagged.
  """
  commits = ["3df40bb8265c0dab3cf574a06a1f1874de2c6b9b"]
  paths = [
    '''conflux-adapters/src/test/java/pay/conflux/backend/adapters/port/VendorCredentialsTest\.java''',
  ]
