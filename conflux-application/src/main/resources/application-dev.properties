# Profile-specific overrides for local development.
# Loaded AFTER application.yml's on-profile: dev section, so values here win.
# Dev credentials only — never copy into staging/prod.

# --- Datasource ---
spring.datasource.url=jdbc:postgresql://localhost:5432/conflux
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Redis ---
spring.data.redis.host=localhost
spring.data.redis.port=6379

# --- Flyway (on by default in dev so V1001..V1017 run on a clean DB) ---
spring.flyway.enabled=true

# --- SuperAdminBootstrap seed (dev only) ---
conflux.identity.super-admin.identifier=admin@conflux.local
conflux.identity.super-admin.password=DevSuperAdmin123!

# --- SQL logging: OFF ---
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# --- Request tracing: ON ---
# Spring Boot's "web" logging group covers DispatcherServlet, handler mapping,
# and the actuator web endpoints. Pair with security=DEBUG to see filter-chain
# decisions (which filter authenticated the request, which authority check ran).
logging.level.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Tomcat access log — one line per request to ./logs/access.<date>.log.
# Pattern: timestamp, remote host, request line, status, bytes, latency in ms.
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.prefix=access
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.pattern=%t %h "%r" %s %b %D ms

# --- Actuator exposure: everything in dev ---
management.endpoints.web.exposure.include=*
