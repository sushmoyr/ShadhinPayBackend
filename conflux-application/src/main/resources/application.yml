spring:
  profiles:
    active: ${SPRING_PROFILE:dev}
  application:
    name: conflux
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
      republish-outstanding-events-on-restart: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, modulith
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

conflux:
  auth:
    token-secret: ${JWT_SECRET:dev-only-secret-do-not-use-in-prod-32bytes!}
  identity:
    jwt:
      secret: ${JWT_SECRET_B64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      expiry-minutes: ${JWT_EXPIRY_MINUTES:60}
    super-admin:
      identifier: ${SUPER_ADMIN_IDENTIFIER:}
      password: ${SUPER_ADMIN_PASSWORD:}
  quota:
    free-per-month: 10
    pending-ttl-seconds: 1800
    final-ttl-seconds: 3024000
  adapters:
    partner-credentials:
      # Inner map keys are kept verbatim by Spring's binder (no relaxed canonicalization
      # for Map<String, Map<String, String>> value entries), so write them as the
      # camelCase keys adapters look up: storeId, storePasswd, baseUrl.
      sslcommerz:
        storeId: ${SSLCOMMERZ_STORE_ID:}
        storePasswd: ${SSLCOMMERZ_STORE_PASSWD:}
        baseUrl: ${SSLCOMMERZ_BASE_URL:https://sandbox.sslcommerz.com}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:conflux}
    username: ${DB_USER:conflux}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: staging
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
conflux:
  auth:
    token-secret: ${JWT_SECRET}

---
# Profile used by the springdoc-openapi-maven-plugin to scrape /v3/api-docs.
# H2 in-memory + Modulith JDBC schema autoinit + no Flyway, so the app boots
# without Postgres or Redis on a CI runner that only has Java.
spring:
  config:
    activate:
      on-profile: openapi
  datasource:
    url: jdbc:h2:mem:conflux-openapi;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      # Hibernate 6 with PostgreSQL dialect defaults to native enum DDL for @Enumerated(STRING);
      # H2 in PostgreSQL mode can't parse that, so force varchar emission here.
      hibernate.type.preferred_enum_jdbc_type: VARCHAR
      # H2 (even in PG mode) rejects reserved words like `value` as unquoted identifiers
      # while Postgres accepts them. Auto-quote keywords so the openapi-profile schema
      # creates cleanly without forcing per-column name quoting in JPA entities.
      hibernate.auto_quote_keyword: true
  flyway:
    enabled: false
  data:
    redis:
      # Lettuce defers the TCP connection until first use; the OpenAPI scrape only
      # hits /v3/api-docs so the stub host below is never contacted. The risk module's
      # BlacklistCache + VelocityCounter beans still wire up cleanly because
      # StringRedisTemplate is available.
      host: localhost
      port: 16379
      repositories:
        enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
conflux:
  identity:
    # The OpenAPI scrape only needs the application context to start so springdoc can
    # serialize @RestController + @Schema metadata. Wave D 1b's SuperAdminBootstrap
    # fails-fast when no SUPER admin row exists AND no seed env vars are set, which
    # would block the H2-backed openapi profile. The values below are fixtures used
    # solely to satisfy that guard at boot — they are never persisted anywhere outside
    # the in-memory H2 instance that exits at the end of the openapi step.
    super-admin:
      identifier: openapi-fixture-super@example.com
      password: openapi-fixture-not-real

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
conflux:
  auth:
    token-secret: ${JWT_SECRET}
