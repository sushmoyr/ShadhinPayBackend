spring:
  profiles:
    active: ${SPRING_PROFILE:dev}
  application:
    name: conflux
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
      republish-outstanding-events-on-restart: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, modulith
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

conflux:
  auth:
    token-secret: ${JWT_SECRET:dev-only-secret-do-not-use-in-prod-32bytes!}
  quota:
    free-per-month: 10
    pending-ttl-seconds: 1800
    final-ttl-seconds: 3024000

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:conflux}
    username: ${DB_USER:conflux}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: staging
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
conflux:
  auth:
    token-secret: ${JWT_SECRET}

---
# Profile used by the springdoc-openapi-maven-plugin to scrape /v3/api-docs.
# H2 in-memory + Modulith JDBC schema autoinit + no Flyway, so the app boots
# without Postgres or Redis on a CI runner that only has Java.
spring:
  config:
    activate:
      on-profile: openapi
  datasource:
    url: jdbc:h2:mem:conflux-openapi;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      # Hibernate 6 with PostgreSQL dialect defaults to native enum DDL for @Enumerated(STRING);
      # H2 in PostgreSQL mode can't parse that, so force varchar emission here.
      hibernate.type.preferred_enum_jdbc_type: VARCHAR
  flyway:
    enabled: false
  data:
    redis:
      # Lettuce defers the TCP connection until first use; the OpenAPI scrape only
      # hits /v3/api-docs so the stub host below is never contacted. The risk module's
      # BlacklistCache + VelocityCounter beans still wire up cleanly because
      # StringRedisTemplate is available.
      host: localhost
      port: 16379
      repositories:
        enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
conflux:
  auth:
    token-secret: ${JWT_SECRET}
