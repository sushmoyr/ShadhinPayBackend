spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

conflux:
  auth:
    token-secret: test-secret-do-not-use-in-prod-32bytes!
  adapters:
    partner-credentials:
      sslcommerz:
        storeId: ""
        storePasswd: ""
        baseUrl: "https://sandbox.sslcommerz.com"
