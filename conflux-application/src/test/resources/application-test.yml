spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

conflux:
  auth:
    token-secret: test-secret-do-not-use-in-prod-32bytes!
  identity:
    jwt:
      secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    super-admin:
      identifier: test-super@example.com
      password: test-super-password
  adapters:
    partner-credentials:
      sslcommerz:
        storeId: ""
        storePasswd: ""
        baseUrl: "https://sandbox.sslcommerz.com"
